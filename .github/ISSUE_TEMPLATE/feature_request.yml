name: Feature request
description: Suggest an improvement or new capability for the SDK
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        The SDK wraps the PayLink payment integration API. Requests that need a new API capability may depend on server-side work first.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the SDK does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API shape or behavior you would like. A sketch of the method call or types is welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds you are using now, or other approaches you weighed.
    validations:
      required: false
